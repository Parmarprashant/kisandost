services:
  - type: web
    name: kisan-ai-service
    env: python
    plan: free
    rootDir: kisan-dost/ventureHack/ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
