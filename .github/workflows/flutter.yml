name: Flutter CI

# Gate for merging a phase branch: all four jobs green, then the debug APK
# from `build` gets installed and smoke-tested on a real device.
on:
  push:
    branches: [main, 'phase/**', 'feat/**']
    paths: ['kisan_app/**', '.github/workflows/flutter.yml']
  pull_request:
    paths: ['kisan_app/**', '.github/workflows/flutter.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: kisan_app

env:
  FLUTTER_VERSION: '3.47.3'

jobs:
  analyze:
    name: Format & analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos

  l10n:
    name: Localization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Fails if any ARB key referenced in Dart is missing from the template,
      # or if a placeholder lost its metadata during import.
      - run: flutter gen-l10n

      # The generated Dart is committed, so a stale checkout is a real bug —
      # someone edited an ARB without regenerating.
      - name: Check generated localizations are up to date
        run: |
          if [ -n "$(git status --porcelain lib/l10n)" ]; then
            echo "::error::lib/l10n is stale. Run 'flutter gen-l10n' and commit the result."
            git --no-pager diff --stat lib/l10n
            exit 1
          fi

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test --coverage --reporter expanded

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: kisan_app/coverage/lcov.info
          if-no-files-found: ignore

  build:
    name: Debug APK
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4

      # Android builds need a JDK; the runner's Flutter setup does not bring one.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # API_BASE_URL defaults to the deployed app (see lib/core/config/env.dart),
      # so this APK talks to production out of the box — which is what we want
      # for a demo build handed to someone to install.
      - run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kisan-app-debug-${{ github.sha }}
          path: kisan_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
